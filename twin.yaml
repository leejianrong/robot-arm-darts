# The only source of calibratable physical parameters (ADR-0006).
schema_version: 1
sim:
  timestep_s: 0.002
  gravity_m_s2: 9.81
servo:                       # STS3215 at ~7.4 V; Menagerie gains
  kp: 998.22
  kv: 2.731
  torque_limit_nm: 2.94      # stall torque, per Menagerie forcerange
  velocity_limit_rad_s: 4.5  # datasheet 4.71 (0.222 s per 60 deg) minus buffer; measure on hardware
dart:
  mass_kg: 0.010
  length_m: 0.12
  radius_m: 0.0035           # 7 mm barrel: the SO-101 jaw gap at its closed limit is about 7 mm
aero:                        # guesses for a 10 g dart with flights; fit to real flights (V9 sysid)
  drag_kg_m: 7.2e-5          # 0.5 * 1.2 kg/m^3 * Cd 1.0 * 1.2 cm^2
  fin_torque_nm: 1.5e-5      # N m per (m/s)^2 per radian of misalignment
  spin_damping_nm_s: 5.0e-6  # kept small: explicit damping is unstable if this * dt / axial inertia > 2
release:
  jaw_hold_rad: -0.17        # jaw command while holding (squeezes against the dart, torque-limited)
  jaw_open_rad: 1.0          # jaw command at release
  pad_friction: 1.0          # jaw pad friction coefficient (Menagerie default; measure on hardware)
board:                       # regulation: centre 1.73 m above floor, scoring radius 170 mm
  distance_m: 0.5            # from the arm base axis; the 4.5 rad/s servo limit reaches about 0.5 m with a nose-first release
  centre_height_m: 1.73
  radius_m: 0.17
  stick_min_speed_m_s: 2.0   # guess: slower than this at the tip and the dart bounces off the cork
  stick_max_angle_rad: 0.9   # guess: more than ~50 deg off the board normal and it glances off
mount:
  height_m: 1.4              # arm base above the floor: shoulder height of an average adult (about 1.4 m)
